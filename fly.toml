app = "stealth-relay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  STEALTH_SERVER__WS_BIND = "0.0.0.0:9090"
  STEALTH_SERVER__METRICS_BIND = "0.0.0.0:9091"
  # The setup/claim page stays on loopback inside the machine. Reach it with
  # `fly proxy 9092 -a stealth-relay`, which authenticates you against Fly,
  # then open the setup URL from `fly logs` against 127.0.0.1:9092.
  # The claim code itself is kept out of the logs; read it with
  # `fly ssh console -C "stealth-relay claim-code"`.
  STEALTH_SERVER__SETUP_BIND = "127.0.0.1:9092"
  STEALTH_LOGGING__LEVEL = "info"
  STEALTH_LOGGING__FORMAT = "json"

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

# Health check against the metrics port from inside Fly's network. Declared as
# a top-level check rather than a published service: /health and /metrics
# describe the server, and there is no reason for the internet to read them.
[checks]
  [checks.health]
    type = "http"
    port = 9091
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "stealth_keys"
  destination = "/var/stealth-relay/keys"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
